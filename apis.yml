name: Pops
description: >-
  Pops is a consumer mobile application, built by Undefined Software, Inc. and
  backed by Y Combinator (Spring 2026), that lets users create, remix, and share
  AI-powered mini games with friends. Every play instantly becomes a funny
  gameplay/reaction video you can send to friends. Pops is available on iOS and
  Android and is organized around game categories such as arcade, 3D, racing,
  sports, puzzles, party, and reaction games. It is an end-user social and gaming
  product with no public API, SDK, or developer platform at this time.
